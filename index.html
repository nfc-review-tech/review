<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>Оставьте отзыв</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: rgba(255, 255, 255, 0.92);
      --text: #1d1d1f;
      --secondary: #86868b;
      --line: rgba(0, 0, 0, 0.08);
      --blue: #007aff;
      --green: #34c759;
      --red: #ff3b30;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 390px;
      padding: 38px 28px 26px;
      text-align: center;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.07), 0 2px 8px rgba(0, 0, 0, 0.03);
      animation: appear 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .icon-badge {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      color: var(--blue);
      background: #eaf3ff;
      border-radius: 18px;
    }

    .icon-badge svg {
      width: 25px;
      height: 25px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .client-title {
      max-width: 300px;
      margin: 0 auto 9px;
      font-size: clamp(23px, 6vw, 28px);
      line-height: 1.12;
      letter-spacing: -0.7px;
      font-weight: 700;
    }

    .step { display: none; }

    .step.active {
      display: block;
      animation: step-in 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .subtitle {
      margin-bottom: 26px;
      color: var(--secondary);
      font-size: 15px;
      line-height: 1.45;
      letter-spacing: -0.1px;
    }

    .btn-main,
    .platform-btn {
      width: 100%;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 15px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.18s ease, filter 0.18s ease, background 0.18s ease;
    }

    .btn-main + .btn-main,
    .platform-btn + .platform-btn { margin-top: 10px; }

    .btn-main:active,
    .platform-btn:active,
    .btn-back:active { transform: scale(0.975); }

    .btn-positive {
      color: #fff;
      background: var(--green);
      box-shadow: 0 7px 16px rgba(52, 199, 89, 0.2);
    }

    .btn-positive:hover { filter: brightness(0.97); }

    .btn-negative {
      color: var(--text);
      background: #e9e9ee;
    }

    .btn-negative:hover { background: #dedee3; }

    .platform-btn {
      min-height: 52px;
      color: #fff;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.08);
    }

    .platform-btn:hover { filter: brightness(0.96); }
    .btn-yandex { background: var(--red); }
    .btn-2gis { background: #20a900; }
    .btn-google { background: var(--blue); }
    .btn-telegram { background: #0a9bd8; }

    .btn-back {
      margin-top: 20px;
      padding: 5px 10px;
      color: var(--blue);
      background: transparent;
      border: 0;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .btn-back:hover { opacity: 0.7; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(12px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes step-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="icon-badge" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M12 20.2S4.5 15.8 4.5 9.8A4.3 4.3 0 0 1 12 7.1a4.3 4.3 0 0 1 7.5 2.7c0 6-7.5 10.4-7.5 10.4Z" />
        <path d="M8.4 11.2h.01M15.6 11.2h.01M9.5 14.4c1.6 1 3.4 1 5 0" />
      </svg>
    </div>

    <h1 class="client-title" id="client-name">Загрузка...</h1>

    <section id="step-1" class="step active">
      <p class="subtitle">Вам всё понравилось при посещении?</p>
      <button class="btn-main btn-positive" onclick="goToStep('step-positive')">Да, всё отлично</button>
      <button class="btn-main btn-negative" onclick="goToStep('step-negative')">Есть замечания</button>
    </section>

    <section id="step-positive" class="step">
      <p class="subtitle">Выберите удобный сервис, чтобы оставить отзыв:</p>
      <a id="btn-yandex" href="#" target="_blank" rel="noopener" class="platform-btn btn-yandex">Яндекс Карты</a>
      <a id="btn-2gis" href="#" target="_blank" rel="noopener" class="platform-btn btn-2gis">2ГИС</a>
      <a id="btn-google" href="#" target="_blank" rel="noopener" class="platform-btn btn-google">Google Maps</a>
      <button class="btn-back" onclick="goToStep('step-1')">Назад</button>
    </section>

    <section id="step-negative" class="step">
      <p class="subtitle">Нам очень жаль. Напишите руководителю напрямую — мы всё исправим.</p>
      <a id="btn-telegram" href="#" target="_blank" rel="noopener" class="platform-btn btn-telegram">Написать в Telegram</a>
      <button class="btn-back" onclick="goToStep('step-1')">Назад</button>
    </section>
  </main>

  <script>
    function goToStep(stepId) {
      document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
      document.getElementById(stepId).classList.add('active');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const clientId = new URLSearchParams(window.location.search).get('id')?.trim() || null;

      fetch('./clients.json?v=' + Date.now(), { cache: 'no-store' })
        .then(response => {
          if (!response.ok) throw new Error('clients.json не найден');
          return response.json();
        })
        .then(data => {
          let client = clientId ? data[clientId] : data[Object.keys(data)[0]];

          if (!client) {
            document.getElementById('client-name').textContent = 'Заведение не найдено';
            return;
          }

          document.getElementById('client-name').textContent = client.name || 'Оцените нашу работу';

          const setPlatform = (btnId, url) => {
            const btn = document.getElementById(btnId);
            if (btn) {
              if (url && url.trim() !== '' && url !== '#') {
                btn.href = url;
                btn.style.display = 'flex';
              } else {
                btn.style.display = 'none';
              }
            }
          };

          setPlatform('btn-yandex', client.yandex);
          setPlatform('btn-2gis', client.gis2);
          setPlatform('btn-google', client.google);
          setPlatform('btn-telegram', client.telegram);
        })
        .catch(error => {
          console.error(error);
          document.getElementById('client-name').textContent = 'Ошибка базы данных';
        });
    });
  </script>
</body>
</html>
